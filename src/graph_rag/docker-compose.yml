services:
  neo4j:
    image: neo4j:5.26.0
    container_name: neo4j_graphrag
    ports:
      - "7687:7687"   # Bolt
      - "7474:7474"   # HTTP
    environment:
      - NEO4J_AUTH=neo4j/graphragpassword
      - NEO4J_dbms_default__database=neo4j
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
