<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG Chatbot - PDF Upload</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Glassmorphism Background */
    body {
      background: linear-gradient(145deg, #4c1d95 0%, #8b5cf6 100%);
      overflow: hidden;
    }
    .glass-effect {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    }
    /* Custom Scrollbar */
    .recent-chat-list::-webkit-scrollbar {
      width: 6px;
    }
    .recent-chat-list::-webkit-scrollbar-track {
      background: transparent;
    }
    .recent-chat-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.4);
      border-radius: 3px;
    }
    /* Liquid Glass Hover Effects */
    .upload-button:hover {
      background: rgba(255, 255, 255, 0.35);
      transform: scale(1.1) rotate(2deg);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
    }
    .back-button:hover {
      background: rgba(255, 255, 255, 0.35);
      transform: scale(1.1);
    }
    .input-glass:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .sidebar-link:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateX(5px);
    }
    .toggle-button:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.1);
    }
    /* Floating Particle Background */
    .particle {
      position: absolute;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      animation: float 15s infinite linear;
    }
    @keyframes float {
      0% { transform: translateY(100vh) scale(0.8); }
      100% { transform: translateY(-20vh) scale(1.2); }
    }
    /* Sidebar Animation */
    .sidebar {
      transition: transform 0.3s ease-in-out;
    }
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
    }
    /* Recent Chats Scrollable Section */
    .recent-chats {
      margin-top: 20px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }
    .recent-chats-title {
      text-white text-md font-semibold mb-2;
    }
    .recent-chat-list {
      max-height: 800px;
      overflow-y: auto;
      margin-top: 5px;
    }
    .recent-chat-item {
      padding: 8px 12px;
      color: #ffffff;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .recent-chat-item:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    /* Profile Section */
    .profile-section {
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.25);
    }
    /* Status Label Style */
    .status-label {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #ffffff;
    }
    .status-label .dot {
      width: 8px;
      height: 8px;
      background-color: #00ff00;
      border-radius: 50%;
    }
    .status-down .dot {
      background-color: #ff0000;
    }
    .status-initializing .dot {
      background-color: #ffa500;
    }
  </style>
</head>
<body class="flex min-h-screen relative">
  <!-- Floating Particles -->
  <div class="particle w-2 h-2 top-10 left-10"></div>
  <div class="particle w-3 h-3 top-40 right-20" style="animation-delay: -5s;"></div>
  <div class="particle w-2 h-2 bottom-20 left-40" style="animation-delay: -10s;"></div>
  <div class="particle w-3 h-3 bottom-10 right-30" style="animation-delay: -2s;"></div>

  <!-- Sidebar -->
  <div id="sidebar" class="sidebar w-64 h-full glass-effect p-4 fixed md:static z-20 flex flex-col space-y-4">
    <div class="flex items-center justify-between">
      <h2 class="text-white text-lg font-bold">Menu</h2>
    </div>
    <nav class="space-y-2">
      <a href="/static/index.html" class="sidebar-link flex items-center space-x-2 p-2 rounded-lg text-white/90 hover:text-white transition glass-effect">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        <span>New Chat</span>
      </a>
      <a href="#" id="history" class="sidebar-link flex items-center space-x-2 p-2 rounded-lg text-white/90 hover:text-white transition glass-effect">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>History</span>
      </a>
      <a href="#" id="upload-pdf" class="sidebar-link flex items-center space-x-2 p-2 rounded-lg text-white/90 hover:text-white transition glass-effect">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12l-4-4m0 0l-4 4m4-4v12" />
        </svg>
        <span>Upload PDF</span>
      </a>
      <a href="#" id="uploaded-knowledges" class="sidebar-link flex items-center space-x-2 p-2 rounded-lg text-white/90 hover:text-white transition glass-effect">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 2h9l5 5v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h2z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 2v6h6" />
        </svg>
        <span>Uploaded Knowledges</span>
      </a>
      <a href="#" id="settings" class="sidebar-link flex items-center space-x-2 p-2 rounded-lg text-white/90 hover:text-white transition glass-effect">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
        </svg>
        <span>Settings</span>
      </a>
    </nav>
    <!-- Recent Chats Section -->
    <div class="recent-chats flex flex-col">
      <h3 class="recent-chats-title text-white text-md font-semibold mb-2">Recent Chats</h3>
      <div id="recent-chat-list" class="recent-chat-list space-y-1">
        <!-- Populated dynamically -->
      </div>
    </div>
    <!-- Profile Section -->
    <div class="profile-section">
      <div class="flex items-center space-x-2 text-white">
        <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center glass-effect">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
          </svg>
        </div>
        <span>John Doe</span>
      </div>
    </div>
  </div>

  <!-- Main Upload Container -->
  <div class="flex flex-col flex-1 h-screen glass-effect">
    <!-- Header -->
    <div class="p-6 bg-gradient-to-r from-purple-900 to-indigo-800 text-white flex items-center justify-between">
      <div class="flex items-center space-x-4">
        <button id="toggle-sidebar" class="toggle-button p-2 rounded-lg bg-white/20 text-white transition">
          <svg id="toggle-icon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center animate-pulse">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div>
        <div>
          <h1 class="text-2xl font-bold tracking-tight">PDF Upload</h1>
        </div>
      </div>
      <div id="status-label" class="status-label status-initializing">
        <span class="dot"></span>
        <span>System Initializing</span>
      </div>
    </div>

    <!-- Upload Form -->
    <div class="flex-1 p-6 overflow-y-auto space-y-5 bg-gradient-to-b from-transparent to-black/5">
      <div class="glass-effect p-6 rounded-xl max-w-lg mx-auto">
        <h2 class="text-white text-xl font-semibold mb-4">Upload a PDF</h2>
        <form id="upload-form" class="space-y-4">
          <input
            type="file"
            id="pdf-file"
            accept=".pdf"
            class="block w-full text-white bg-white/10 rounded-lg p-3 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-white file:bg-white/20 hover:file:bg-white/30"
          />
          <div class="flex space-x-4">
            <button
              type="submit"
              class="upload-button p-3 bg-white/25 text-white rounded-lg transition duration-300 w-full"
            >
              Upload PDF
            </button>
            <a
              href="/static/index.html"
              class="back-button p-3 bg-white/25 text-white rounded-lg transition duration-300 text-center w-full"
            >
              Back to Chat
            </a>
          </div>
        </form>
        <div id="upload-message" class="mt-4 text-white"></div>
      </div>
    </div>
  </div>

  <script>
    const uploadForm = document.getElementById('upload-form');
    const pdfFileInput = document.getElementById('pdf-file');
    const uploadMessage = document.getElementById('upload-message');
    const sidebar = document.getElementById('sidebar');
    const toggleSidebarBtn = document.getElementById('toggle-sidebar');
    const toggleIcon = document.getElementById('toggle-icon');
    const statusLabel = document.getElementById('status-label');
    const recentChatList = document.getElementById('recent-chat-list');
    const API_URL = 'http://localhost:9000';

    // Update status label
    async function updateStatus() {
      try {
        const response = await fetch(`${API_URL}/health`, { method: 'GET' });
        const data = await response.json();
        if (response.ok && data.status === 'healthy') {
          statusLabel.className = 'status-label';
          statusLabel.innerHTML = '<span class="dot"></span><span>System Standby</span>';
        } else {
          statusLabel.className = 'status-label status-down';
          statusLabel.innerHTML = '<span class="dot"></span><span>System Down</span>';
        }
      } catch (error) {
        statusLabel.className = 'status-label status-down';
        statusLabel.innerHTML = '<span class="dot"></span><span>System Down</span>';
      }
    }

    // Populate recent chats
    async function populateRecentChats() {
      try {
        const response = await fetch(`${API_URL}/simple/chat-memory/`, { method: 'GET' });
        const data = await response.json();
        recentChatList.innerHTML = '';
        if (data.chat_memory && data.chat_memory.length > 0) {
          data.chat_memory.forEach(chat => {
            const chatItem = document.createElement('div');
            chatItem.className = 'recent-chat-item';
            chatItem.textContent = chat.query.length > 30 ? chat.query.substring(0, 27) + '...' : chat.query;
            chatItem.onclick = () => {
              window.location.href = '/static/index.html';
            };
            recentChatList.appendChild(chatItem);
          });
        } else {
          const noChats = document.createElement('div');
          noChats.className = 'recent-chat-item';
          noChats.textContent = 'No recent chats';
          recentChatList.appendChild(noChats);
        }
      } catch (error) {
        console.error('Error fetching chat memory:', error);
        const errorItem = document.createElement('div');
        errorItem.className = 'recent-chat-item';
        errorItem.textContent = 'Error loading chats';
        recentChatList.appendChild(errorItem);
      }
    }

    // Handle form submission
    uploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = pdfFileInput.files[0];
      if (!file) {
        uploadMessage.textContent = 'Please select a PDF file.';
        uploadMessage.className = 'mt-4 text-red-400';
        return;
      }

      const formData = new FormData();
      formData.append('file', file);
      uploadMessage.textContent = 'Uploading...';
      uploadMessage.className = 'mt-4 text-white';

      try {
        const response = await fetch(`${API_URL}/simple/upload-pdf/`, {
          method: 'POST',
          body: formData
        });
        const data = await response.json();
        if (response.ok) {
          uploadMessage.textContent = data.message;
          uploadMessage.className = 'mt-4 text-green-400';
        } else {
          uploadMessage.textContent = `Error: ${data.detail || 'Upload failed'}`;
          uploadMessage.className = 'mt-4 text-red-400';
        }
      } catch (error) {
        uploadMessage.textContent = 'Error: Cannot connect to the server. Please ensure the FastAPI server is running.';
        uploadMessage.className = 'mt-4 text-red-400';
      }
    });

    // Toggle sidebar
    let isSidebarOpen = false;
    function updateSidebar() {
      sidebar.classList.toggle('open', isSidebarOpen);
      toggleIcon.innerHTML = isSidebarOpen
        ? `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />`
        : `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />`;
    }

    toggleSidebarBtn.addEventListener('click', () => {
      isSidebarOpen = !isSidebarOpen;
      updateSidebar();
    });

    // Update sidebar on window resize
    window.addEventListener('resize', () => {
      if (window.innerWidth >= 768 && !isSidebarOpen) {
        isSidebarOpen = true;
        updateSidebar();
      }
    });

    // Initial setup
    updateSidebar();
    updateStatus();
    populateRecentChats();
    // Periodically update status
    setInterval(updateStatus, 30000);
  </script>
</body>
</html>
